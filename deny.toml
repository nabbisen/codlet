# Supply-chain scanning policy (RFC-039). Checks what codlet depends on; the
# `xtask` release gates check codlet's own source. Disjoint, both required.
#
# Blocking policy (RFC-039 §3.1): `bans`, `licenses`, `sources` block on every
# run, because a failure always names something a developer just changed.
# `advisories` is reported (non-blocking) on pull requests and blocking only
# in `.github/workflows/release-gates.yml`, triggered on a version tag -- a
# third party can publish an advisory at any time, and blocking that on every
# unrelated PR produces a permanent `ignore` list, which is a gate switched
# off while still appearing to run.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# This section is considered when running `cargo deny check advisories`.
[advisories]
# No `ignore` entries (RFC-039 §3.1, handoff §3.1): a finding here is
# reported, never silenced. If this ever needs an entry, that is a decision
# for the RFC-039 process, not a routine edit.
ignore = []

# This section is considered when running `cargo deny check licenses`.
[licenses]
# Derived from the actual workspace dependency graph at RFC-039's acceptance
# (§3.2), not copied from a template. Two traps that a copied list would
# have missed: `Unicode-3.0` covers 18 ICU packages reached via `sqlx`, and
# two expressions use `AND` (`MIT AND BSD-3-Clause`,
# `(MIT OR Apache-2.0) AND Unicode-3.0`), which require every named license
# in the expression to be allowed, not just one.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.8
# `cargo-deny` defaults this to false ("dev-dependencies are not used by
# downstream crates, nor part of binary artifacts"). RFC-039 §3.2's license
# survey nonetheless covers the full graph including dev-dependencies -- its
# table sums to 188 packages, matching `cargo metadata`'s full package count,
# not cargo-deny's narrower default scope (171 unique names with dev-only
# nodes excluded). Set true to match what was actually audited: a
# dev-dependency's license is unchecked otherwise, leaving a blind spot the
# RFC's own table implies was already closed.
include-dev = true

[licenses.private]
ignore = false

# This section is considered when running `cargo deny check bans`.
[bans]
# Duplicate-version detection starts at `warn`, not `deny` (RFC-039 §3.4):
# the graph has not been audited for duplicates, and a first-day `deny` would
# violate the "must pass on the day it lands" rule (RFC-039 §3.2). Revisit
# after one release cycle of warnings (RFC-039 §8.1).
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# No specific crate bans yet -- there is no reason for one (RFC-039 §3.4).
allow = []
deny = []
skip = []
skip-tree = []

# This section is considered when running `cargo deny check sources`.
[sources]
# codlet has no git or alternate-registry dependencies today; a dependency
# silently acquiring one is a supply-chain event that should require a
# deliberate policy change (RFC-039 §3.3), so both lint levels are `deny`
# rather than the default `warn`.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
