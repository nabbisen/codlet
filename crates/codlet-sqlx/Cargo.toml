[package]
name = "codlet-sqlx"
description = "SQLite and PostgreSQL storage adapters for codlet, backed by SQLx (RFC-011, RFC-034)."
readme = "README.md"
version.workspace      = true
edition.workspace      = true
# Not workspace-inherited: the sqlx 0.9.0 dependency itself declares
# rust-version 1.94.0, which is stricter than the workspace default of 1.85
# (RFC-036 review R-1). This documents a pre-existing fact about the sqlx
# dependency, not a newly introduced requirement.
rust-version           = "1.94"
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[features]
# No default: callers choose their backend explicitly.
# Use `--features sqlite` for SQLite or `--features postgres` for PostgreSQL.
# Both can be enabled simultaneously.
default       = ["sqlite"]
sqlite        = ["sqlx/sqlite"]
postgres      = ["sqlx/postgres"]
# Opt-in TLS for PostgreSQL connections (RFC-056): rustls with the ring provider
# and the webpki root store. Named as the resolved sqlx feature, not the
# `tls-rustls` alias, so an upstream alias change cannot swap the provider.
postgres-rustls = ["postgres", "sqlx/tls-rustls-ring-webpki"]
# A test gate only: enables the Docker-backed integration tests. It pulls no
# dependency into a consumer's graph.
postgres-test = ["postgres"]

[dependencies]
codlet                 = { workspace = true }
# runtime-tokio is unconditional: both SQLite and PostgreSQL adapters require
# an async runtime and tokio is the only supported choice. Hosts using
# async-std must wrap calls via a tokio runtime block.
sqlx                   = { workspace = true, features = ["runtime-tokio"] }
tokio                  = { workspace = true, features = ["rt"] }

[dev-dependencies]
codlet-conformance     = { path = "../codlet-conformance" }
tokio                  = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tempfile               = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
