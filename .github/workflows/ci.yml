name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # RFC-009 item 2: codlet must compile for wasm32-unknown-unknown
  # (required for the Cloudflare Workers D1 adapter).
  wasm32-compile:
    name: codlet wasm32 compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p codlet --target wasm32-unknown-unknown

  # RFC-033: codlet-worker must compile for wasm32-unknown-unknown.
  wasm32-worker-compile:
    name: codlet-worker wasm32 compile check (RFC-033)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p codlet-worker --target wasm32-unknown-unknown
      # RFC-054 stage B: the conformance suite (minus its tokio-based concurrency
      # test) must keep compiling for wasm, or the D1 stores cannot be tested.
      - run: cargo check -p codlet-conformance --target wasm32-unknown-unknown --no-default-features

  # RFC-033 §14 + RFC-054: Miniflare integration tests (local D1 + KV, no
  # credentials). Two vitest projects: the JavaScript harness (D1 binding
  # behaviour, concurrent claim) and the REAL Rust D1 stores, built to wasm by
  # `worker-build` from the test-only crate crates/codlet-worker-miniflare and
  # driven by codlet-conformance (RFC-054 stage C).
  wrangler-test:
    name: codlet-worker Miniflare integration tests (RFC-033 §14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: install worker-build
        run: cargo install worker-build --version 0.8.4 --locked
      - name: build the real Rust D1 stores for Miniflare
        run: worker-build --dev crates/codlet-worker-miniflare --out-dir ../codlet-worker/tests/rust-build
      - run: cd crates/codlet-worker/tests && npm ci && npx vitest run

  # RFC-009 item 3: a Send+Sync store satisfies the trait without adapter
  # shims — proven by the rfc_009_compile test in codlet.
  test-send-compat:
    name: RFC-009 Send/!Send compile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p codlet --test rfc_009_compile --all-features
  test-core:
    name: test codlet (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p codlet --all-features

  test-conformance:
    name: test codlet-conformance + in-memory stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p codlet-conformance --all-features

  test-sqlx:
    name: test codlet-sqlx (SQLite adapter conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # `--all-features` would also activate `postgres-test`, which requires
      # Docker via testcontainers — select the SQLite backend explicitly so
      # this job stays Docker-free (RFC-036 §5.5).
      - run: cargo test -p codlet-sqlx --no-default-features --features sqlite

  # RFC-034: PostgreSQL adapter conformance (requires Docker for testcontainers).
  # RFC-058: run on BOTH ends of the supported range (15 and 18), pinned in
  # codlet's own test fixtures (tests/common/mod.rs) and chosen here per leg via
  # CODLET_TEST_PG_MAJOR. The fixtures assert the server they connected to has
  # that major version, so a leg that ends up testing the wrong server fails
  # instead of passing; and the fixtures fail if the variable is unset under CI
  # (the `CI` variable, which GitHub Actions sets), so dropping the `env:` below
  # cannot make every leg quietly test 15.
  test-postgres:
    name: test codlet-sqlx postgres adapter (RFC-034) on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "18"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # `--no-default-features` ensures the SQLite driver is NOT compiled —
      # verifying the feature isolation that RFC-034 requires.
      - run: cargo test -p codlet-sqlx --no-default-features --features postgres-test

  # RFC-056: the `postgres-rustls` feature, against a real TLS-enabled PostgreSQL.
  # Runs the whole PostgreSQL suite with the feature on, plus the TLS test: a
  # sslmode=require connection, checked from the server's side (pg_stat_ssl), with
  # a real store operation over it. Needs Docker and the `openssl` binary.
  # RFC-058: on both ends of the range too — the server's OpenSSL differs.
  test-postgres-tls:
    name: test codlet-sqlx postgres over TLS (RFC-056) on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "18"]
    env:
      CODLET_TEST_PG_MAJOR: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p codlet-sqlx --no-default-features --features postgres-test,postgres-rustls

  test-examples:
    name: build and run codlet examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Examples are five standalone packages (DEC-003), not bins of one
      # package. Build all five; run only the non-interactive ones —
      # axum_login_logout binds a port and never exits, and sqlite_file is a
      # deliberate two-invocation flow (RFC-036 §5.3).
      - run: cargo build -p axum_login_logout -p sqlite_quickstart -p sqlite_file -p key_rotation -p form_token_csrf
      - run: cargo run -p sqlite_quickstart
      - run: cargo run -p key_rotation
      - run: cargo run -p form_token_csrf

  core-feature-matrix:
    name: codlet feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # RFC-002 acceptance: core must build without adapter features and in
      # representative feature combinations.
      - run: cargo build -p codlet --no-default-features
      - run: cargo build -p codlet
      - run: cargo build -p codlet --features serde,test-utils

  core-deps:
    name: core dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # RFC-002 §10.5: codlet must not pull in framework, DB, or executor
      # crates. Fail the build if any forbidden crate appears in its tree.
      # A gate must fail when it cannot perform its check (RFC-036 §3.5) —
      # this step asserts non-empty, expected output before drawing any
      # conclusion from it, rather than trusting a possibly-empty grep input.
      - name: assert no framework/db/executor crates in codlet
        run: |
          set -euo pipefail
          tree="$(cargo tree -p codlet -e normal --prefix none --color never | sort -u)"
          echo "$tree"
          test -n "$tree"
          echo "$tree" | grep -q '^codlet ' || { echo "::error::unexpected cargo tree output"; exit 1; }
          if echo "$tree" | grep -Eiq '^(axum|tower|tower-http|sqlx|tokio|async-std|worker|hyper|reqwest)( |$)'; then
            echo "::error::forbidden runtime/db/framework crate found in codlet"
            exit 1
          fi
          # RFC-049 §5: codlet is the runtime-neutral core (RFC-002) and
          # targets wasm with opt-level = "s" -- its minimality is a
          # principle, not an accident. Assert its tree carries no duplicate
          # versions of any crate. Scoped to codlet only, deliberately:
          # codlet-sqlx carries known upstream duplicates (sha2/digest/
          # crypto-common/block-buffer, RFC-049 §4) that this gate must not
          # be extended to cover -- a check that fails on introduction for a
          # reason nobody can fix is the ignore-list trap RFC-039 §3.2 warns
          # against.
          dupes="$(echo "$tree" | sed 's/ (\*)$//' | grep -E '^[a-zA-Z0-9_-]+ v' \
            | sort -u | awk '{print $1}' | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::duplicate versions in codlet's dependency tree: $dupes"
            exit 1
          fi

      # RFC-052 §4.3: test tooling must not be reachable from a published
      # feature of codlet-sqlx. `postgres-test` is a test gate only; the
      # Docker client / HTTP / TLS stack that testcontainers brings belongs to
      # dev-dependencies. Same shape as above (RFC-036 §3.5): capture, assert
      # non-empty, assert a known marker line, and only then match, so a
      # failed `cargo tree` cannot pass as an empty grep.
      #
      # Two feature sets, not one. `--features postgres` is the production
      # PostgreSQL graph, but it cannot see a dependency that is optional and
      # enabled only by another feature -- which is exactly how the original
      # defect was shaped (`postgres-test` -> `dep:testcontainers-modules`).
      # Demonstrated: with that defect reintroduced, `--features postgres`
      # passes. `--all-features` walks every published feature, so it fails.
      - name: assert no test-only crates reachable from codlet-sqlx's published features
        run: |
          set -euo pipefail
          for features in "--features postgres --no-default-features" "--all-features"; do
            tree="$(cargo tree -p codlet-sqlx $features -e normal --prefix none --color never | sort -u)"
            echo "== cargo tree -p codlet-sqlx $features"
            echo "$tree"
            test -n "$tree"
            echo "$tree" | grep -q '^codlet-sqlx ' || { echo "::error::unexpected cargo tree output ($features)"; exit 1; }
            if echo "$tree" | grep -Eiq '^(testcontainers|testcontainers-modules|bollard|bollard-stubs|bollard-buildkit-proto|ureq)( |$)'; then
              echo "::error::test-only dependency reachable from a published feature ($features)"
              exit 1
            fi
          done

  # RFC-036 §3.2 / review R-1: rust-version is a per-package field, not a
  # single workspace-wide floor. codlet, codlet-conformance, codlet-worker,
  # and xtask hold to 1.85 (rust-version.workspace = true); codlet-sqlx does
  # not — see the msrv-sqlx job below. rust-toolchain.toml stays pinned to
  # `stable` for local development; RUSTUP_TOOLCHAIN overrides it here so this
  # job actually builds on the declared MSRV rather than silently passing on
  # stable.
  msrv:
    name: MSRV 1.85 build (codlet, codlet-conformance, codlet-worker, xtask)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: assert the MSRV toolchain is actually in use
        run: |
          rustc --version
          rustc --version | grep -q '1\.85\.' || { echo "::error::not building with 1.85"; exit 1; }
      - run: cargo check -p codlet -p codlet-conformance -p codlet-worker -p xtask --all-targets

  # codlet-sqlx declares rust-version = "1.94" (RFC-036 review R-1): its own
  # sqlx 0.9.0 dependency requires rustc 1.94.0, stricter than the workspace
  # default. Checked on its own declared floor, not the workspace's.
  msrv-sqlx:
    name: MSRV 1.94 build (codlet-sqlx)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.94.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: assert the MSRV toolchain is actually in use
        run: |
          rustc --version
          rustc --version | grep -q '1\.94\.' || { echo "::error::not building with 1.94"; exit 1; }
      - run: cargo check -p codlet-sqlx --all-targets

  release-check:
    name: release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- release-check

  # RFC-040 §3.2: proves each release gate can fail, not merely that it
  # exists. A gate that passes its own violation fixture is itself a
  # failure and makes this job (and self-test's own exit code) non-zero.
  self-test:
    name: xtask self-test (RFC-040)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- self-test

  # RFC-039 §3.1: bans/licenses/sources change state only when a developer
  # changes a dependency, so a failure always names something that just
  # happened. Blocking is correct here.
  supply-chain:
    name: supply chain (bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # RFC-039 §3.1: advisories change state when a third party publishes a
  # RUSTSEC entry, at an arbitrary time, against a dependency this project may
  # not have touched. Blocking that on every pull request would let an
  # upstream publication freeze unrelated work, which produces a permanent
  # `ignore` list -- a gate switched off while still appearing to run.
  # Reported here (non-blocking); blocking happens at release, in
  # release-gates.yml.
  advisories:
    name: supply chain (advisories, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  docs:
    name: doc build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
