name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # RFC-009 item 2: codlet must compile for wasm32-unknown-unknown
  # (required for the Cloudflare Workers D1 adapter).
  wasm32-compile:
    name: codlet wasm32 compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p codlet --target wasm32-unknown-unknown

  # RFC-033: codlet-worker must compile for wasm32-unknown-unknown.
  wasm32-worker-compile:
    name: codlet-worker wasm32 compile check (RFC-033)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p codlet-worker --target wasm32-unknown-unknown

  # RFC-033 §14: Miniflare integration tests (local D1 + KV, no credentials).
  wrangler-test:
    name: codlet-worker Miniflare integration tests (RFC-033 §14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: cd crates/codlet-worker/tests && npm ci && npx vitest run

  # RFC-009 item 3: a Send+Sync store satisfies the trait without adapter
  # shims — proven by the rfc_009_compile test in codlet.
  test-send-compat:
    name: RFC-009 Send/!Send compile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p codlet --test rfc_009_compile --all-features
  test-core:
    name: test codlet (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p codlet --all-features

  test-conformance:
    name: test codlet-conformance + in-memory stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p codlet-conformance --all-features

  test-sqlx:
    name: test codlet-sqlx (SQLite adapter conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # `--all-features` would also activate `postgres-test`, which requires
      # Docker via testcontainers — select the SQLite backend explicitly so
      # this job stays Docker-free (RFC-036 §5.5).
      - run: cargo test -p codlet-sqlx --no-default-features --features sqlite

  # RFC-034: PostgreSQL adapter conformance (requires Docker for testcontainers).
  test-postgres:
    name: test codlet-sqlx postgres adapter (RFC-034)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # `--no-default-features` ensures the SQLite driver is NOT compiled —
      # verifying the feature isolation that RFC-034 requires.
      - run: cargo test -p codlet-sqlx --no-default-features --features postgres-test

  test-examples:
    name: build and run codlet examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Examples are five standalone packages (DEC-003), not bins of one
      # package. Build all five; run only the non-interactive ones —
      # axum_login_logout binds a port and never exits, and sqlite_file is a
      # deliberate two-invocation flow (RFC-036 §5.3).
      - run: cargo build -p axum_login_logout -p sqlite_quickstart -p sqlite_file -p key_rotation -p form_token_csrf
      - run: cargo run -p sqlite_quickstart
      - run: cargo run -p key_rotation
      - run: cargo run -p form_token_csrf

  core-feature-matrix:
    name: codlet feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # RFC-002 acceptance: core must build without adapter features and in
      # representative feature combinations.
      - run: cargo build -p codlet --no-default-features
      - run: cargo build -p codlet
      - run: cargo build -p codlet --features serde,test-utils

  core-deps:
    name: core dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # RFC-002 §10.5: codlet must not pull in framework, DB, or executor
      # crates. Fail the build if any forbidden crate appears in its tree.
      # A gate must fail when it cannot perform its check (RFC-036 §3.5) —
      # this step asserts non-empty, expected output before drawing any
      # conclusion from it, rather than trusting a possibly-empty grep input.
      - name: assert no framework/db/executor crates in codlet
        run: |
          set -euo pipefail
          tree="$(cargo tree -p codlet -e normal --prefix none | sort -u)"
          echo "$tree"
          test -n "$tree"
          echo "$tree" | grep -q '^codlet ' || { echo "::error::unexpected cargo tree output"; exit 1; }
          if echo "$tree" | grep -Eiq '^(axum|tower|tower-http|sqlx|tokio|async-std|worker|hyper|reqwest)( |$)'; then
            echo "::error::forbidden runtime/db/framework crate found in codlet"
            exit 1
          fi

  # RFC-036 §3.2 / review R-1: rust-version is a per-package field, not a
  # single workspace-wide floor. codlet, codlet-conformance, codlet-worker,
  # and xtask hold to 1.85 (rust-version.workspace = true); codlet-sqlx does
  # not — see the msrv-sqlx job below. rust-toolchain.toml stays pinned to
  # `stable` for local development; RUSTUP_TOOLCHAIN overrides it here so this
  # job actually builds on the declared MSRV rather than silently passing on
  # stable.
  msrv:
    name: MSRV 1.85 build (codlet, codlet-conformance, codlet-worker, xtask)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: assert the MSRV toolchain is actually in use
        run: |
          rustc --version
          rustc --version | grep -q '1\.85\.' || { echo "::error::not building with 1.85"; exit 1; }
      - run: cargo check -p codlet -p codlet-conformance -p codlet-worker -p xtask --all-targets

  # codlet-sqlx declares rust-version = "1.94" (RFC-036 review R-1): its own
  # sqlx 0.9.0 dependency requires rustc 1.94.0, stricter than the workspace
  # default. Checked on its own declared floor, not the workspace's.
  msrv-sqlx:
    name: MSRV 1.94 build (codlet-sqlx)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.94.0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: assert the MSRV toolchain is actually in use
        run: |
          rustc --version
          rustc --version | grep -q '1\.94\.' || { echo "::error::not building with 1.94"; exit 1; }
      - run: cargo check -p codlet-sqlx --all-targets

  release-check:
    name: release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- release-check

  # RFC-039 §3.1: bans/licenses/sources change state only when a developer
  # changes a dependency, so a failure always names something that just
  # happened. Blocking is correct here.
  supply-chain:
    name: supply chain (bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # RFC-039 §3.1: advisories change state when a third party publishes a
  # RUSTSEC entry, at an arbitrary time, against a dependency this project may
  # not have touched. Blocking that on every pull request would let an
  # upstream publication freeze unrelated work, which produces a permanent
  # `ignore` list -- a gate switched off while still appearing to run.
  # Reported here (non-blocking); blocking happens at release, in
  # release-gates.yml.
  advisories:
    name: supply chain (advisories, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  docs:
    name: doc build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
